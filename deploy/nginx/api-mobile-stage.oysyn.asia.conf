upstream oysyn_mobile_stage {
    server 127.0.0.1:8101;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=oysyn_mobile_stage_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=oysyn_mobile_stage_register:10m rate=3r/m;

server {
    listen 80;
    server_name api-mobile-stage.oysyn.asia;
    server_tokens off;
    client_max_body_size 55m;
    limit_req_status 429;

    location = /api/v1/auth/login {
        limit_req zone=oysyn_mobile_stage_auth burst=5 nodelay;
        try_files __never_exists__ @oysyn_mobile_stage_app;
    }

    location = /api/v1/auth/refresh {
        limit_req zone=oysyn_mobile_stage_auth burst=10 nodelay;
        try_files __never_exists__ @oysyn_mobile_stage_app;
    }

    location = /api/v1/auth/register {
        limit_req zone=oysyn_mobile_stage_register burst=2 nodelay;
        try_files __never_exists__ @oysyn_mobile_stage_app;
    }

    location = /api/v1/qr-login/sessions {
        limit_req zone=oysyn_mobile_stage_auth burst=10 nodelay;
        try_files __never_exists__ @oysyn_mobile_stage_app;
    }

    location ~ ^/api/v1/qr-login/sessions/[^/]+/(status|approve|reject|consume)$ {
        access_log off;
        limit_req zone=oysyn_mobile_stage_auth burst=10 nodelay;
        try_files __never_exists__ @oysyn_mobile_stage_app;
    }

    location / {
        try_files __never_exists__ @oysyn_mobile_stage_app;
    }

    location @oysyn_mobile_stage_app {
        proxy_pass http://oysyn_mobile_stage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
